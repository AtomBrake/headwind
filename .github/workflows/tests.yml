name: Tests

on:
  # every branch push; tag pushes are left to the Windows build, which runs the tests itself
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

# a newer push to the same branch supersedes a run still in progress
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'   # matches the Docker image and the Windows build
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: python -m pytest tests -q -n auto

  # known vulnerabilities in the exact versions the Docker image installs; a new advisory fails this on the next push
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit requirements.lock
        run: pip-audit --requirement requirements.lock --require-hashes --progress-spinner off
