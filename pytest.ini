[pytest]
# Text read or written without encoding= uses the locale's encoding: UTF-8 on Linux and macOS, cp1252 on Windows. With
# PYTHONWARNDEFAULTENCODING=1 (tests/conftest.py sets it for the -n auto workers; CI sets it for every run) Python warns about each one,
# and this makes the warning fail the test on every OS, not only on Windows.
filterwarnings =
    error::EncodingWarning
